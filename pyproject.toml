[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["peft-0.5.0", "notebooks"]

[tool.ruff.lint]
# Pyflakes (F) plus a pragmatic pycodestyle subset (E4/E7/E9).
# Whitespace/line-length style rules are intentionally left out for now;
# tighten incrementally as the prototypes stabilize.
select = ["E4", "E7", "E9", "F"]
