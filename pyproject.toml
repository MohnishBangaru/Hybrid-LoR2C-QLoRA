[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lor2c"
version = "0.1.0"
description = "Hybrid LoR2C + QLoRA parameter-efficient fine-tuning with a strict layered architecture."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Mohnish Bangaru" }]
keywords = ["lora", "lor2c", "qlora", "peft", "quantization", "fine-tuning"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.1",
  "pydantic>=2.5",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
huggingface = [
  "transformers>=4.40",
  "peft>=0.10",
  "datasets>=2.18",
  "accelerate>=0.28",
  "sentencepiece>=0.1.99",
  "bitsandbytes>=0.43; sys_platform == 'linux'",
]
vision = ["pillow>=10.0", "nltk>=3.8"]
tracking = ["wandb>=0.16"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "pre-commit>=3.7",
]

[project.scripts]
lor2c = "lor2c.cli.main:CommandLine.run"

[project.urls]
Repository = "https://github.com/MohnishBangaru/Hybrid-LoR2C-QLoRA"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lor2c = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["legacy", "notebooks", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ANN", "SIM", "RUF"]
ignore = ["ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["lor2c"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["lor2c"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = ["integration: requires optional heavy dependencies"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.coverage.run]
source = ["lor2c"]
omit = ["src/lor2c/infrastructure/huggingface/*", "src/lor2c/infrastructure/tracking/wandb.py"]
